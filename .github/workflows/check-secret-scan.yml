# Secret scan. First in the pipeline because it is the only check whose
# failure is unrecoverable: history is treated as published (SEC-4), so a
# committed secret stays committed even after it is removed.
#
# fetch-depth: 0 is required. Scanning only the tip would miss exactly the
# case this exists to catch.

name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
